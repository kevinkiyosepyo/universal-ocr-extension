<!doctype html><meta charset="utf-8"><title>Geetest image adapter fixture</title>
<style>
body{font:16px sans-serif;margin:20px}.geetest_box{width:324px;padding:16px;border:1px solid #ccc}.geetest_header{display:flex;align-items:center;justify-content:space-between;min-height:50px}.geetest_ques_tips img{width:32px;height:32px;display:inline-block}.geetest_bg{position:relative;width:300px;height:200px;background-size:100% 100%}.geetest_submit{padding:12px;background:#5693e5;text-align:center;margin-top:8px}.geetest_disable{opacity:.5}.geetest_square_mark{position:absolute;width:20px;height:20px;background:#24b;color:white;border-radius:50%;pointer-events:none}.geetest_nine .geetest_window{width:300px;height:270px;display:grid;grid-template-columns:repeat(3,96px);grid-template-rows:repeat(3,86px);gap:6px}.geetest_item{position:relative}.geetest_item_img{width:96px;height:86px;background-size:300% auto;background-repeat:repeat}.geetest_item_ghost{position:absolute;inset:0}.geetest_selected{outline:3px solid blue;outline-offset:-3px}.geetest_result_tips{display:none}
</style>
<form><div class="geetest_captcha"><div class="geetest_box"><div class="geetest_header"><div class="geetest_text_tips"></div><div class="geetest_ques_tips"></div></div><div class="geetest_container"></div></div></div><button id="application-submit">Submit application</button></form>
<script type="module">
import * as adapter from '/geetest-images-adapter.js';window.adapter=adapter;
const mode=new URL(location.href).searchParams.get('mode')||'icons',grid=mode.startsWith('grid');window.counts={clicks:[],verify:0,submit:0};window.fixtureAccepted=false;
let moved,lastClick=-Infinity;window.clickTimes=[];document.addEventListener('mousemove',event=>{moved={x:event.clientX,y:event.clientY};});const validSequence=event=>{const now=performance.now();if(mode.endsWith('-drop')&&counts.clicks.length===1)return false;if(moved?.x!==event.clientX||moved?.y!==event.clientY||event.detail!==1||event.screenX===0||event.screenY===0||now-lastClick<500)return false;lastClick=now;clickTimes.push(now);return true;};
document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();counts.submit++;});
const image=(width,height,variant=0)=>{const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const c=canvas.getContext('2d');for(let y=0;y<3;y++)for(let x=0;x<3;x++){c.fillStyle=`hsl(${(y*3+x)*40+variant} 70% 65%)`;c.fillRect(x*width/3,y*height/3,width/3,height/3);}return canvas.toDataURL();};
const header=document.querySelector('.geetest_text_tips'),references=document.querySelector('.geetest_ques_tips'),container=document.querySelector('.geetest_container');
header.textContent=grid?'Select 3 images with':'Select in this order';
for(let i=0;i<(grid?1:3);i++){const ref=document.createElement('img');ref.src=image(32,32,i*30);references.append(ref);}
window.refresh=()=>{if(grid)document.querySelectorAll('.geetest_item_img').forEach(node=>node.style.backgroundImage=`url(${image(288,258,19)})`);else document.querySelector('.geetest_bg').style.backgroundImage=`url(${image(300,200,19)})`;};
window.showSuccess=()=>document.querySelector('.geetest_captcha').classList.add('geetest_success');
if(grid){
  container.innerHTML='<div class="geetest_nine"><div class="geetest_window"></div></div>';const windowNode=container.querySelector('.geetest_window'),sheet=image(288,258);
  for(let i=0;i<9;i++){const tile=document.createElement('div');tile.className=`geetest_item geetest_${i}`;tile.innerHTML=`<div class="geetest_item_wrap"><div class="geetest_item_img" style="background-image:url(${sheet});background-position:${-(i%3)*100}% ${-Math.floor(i/3)*100}%"></div></div><div class="geetest_item_ghost"><div class="geetest_item_icon"></div></div>`;windowNode.append(tile);tile.addEventListener('click',event=>{if(!validSequence(event))return;const ghost=tile.querySelector('.geetest_item_ghost');ghost.classList.toggle('geetest_selected');counts.clicks.push(i);if(mode==='grid-refresh'&&counts.clicks.length===1)refresh();if(document.querySelectorAll('.geetest_selected').length===3){counts.verify++;fixtureAccepted=[0,4,8].every(index=>document.querySelector('.geetest_'+index+' .geetest_selected'));if(fixtureAccepted&&mode==='grid-pass')showSuccess();}});}
}else{
  container.innerHTML='<div class="geetest_click"><div class="geetest_window"><div class="geetest_bg"></div><div class="geetest_result_tips"></div></div><div class="geetest_submit geetest_disable"><div class="geetest_submit_tips">OK</div></div></div>';const scene=container.querySelector('.geetest_bg');scene.style.backgroundImage=`url(${image(300,200)})`;
  scene.addEventListener('click',event=>{if(!validSequence(event))return;const box=scene.getBoundingClientRect(),point={x:(event.clientX-box.x)/box.width,y:(event.clientY-box.y)/box.height};counts.clicks.push(point);const marker=document.createElement('div');marker.className='geetest_square_mark';marker.style.left=point.x*100+'%';marker.style.top=point.y*100+'%';marker.innerHTML=`<div class="geetest_mark_no">${counts.clicks.length}</div>`;scene.append(marker);container.querySelector('.geetest_submit').classList.remove('geetest_disable');if(mode==='icons-refresh'&&counts.clicks.length===1)refresh();if(mode==='icons-reference'&&counts.clicks.length===1)references.firstElementChild.src=image(32,32,88);});
  container.querySelector('.geetest_submit').addEventListener('click',()=>{counts.verify++;fixtureAccepted=counts.clicks.length===3;if(fixtureAccepted&&mode==='icons-pass')showSuccess();});
}
await Promise.all([...references.querySelectorAll('img')].map(image=>image.decode()));window.ready=true;
</script>
