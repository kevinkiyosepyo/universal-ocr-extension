<!doctype html><meta charset="utf-8"><title>Binance SDK slider fixture</title>
<style>
body{margin:20px;font:16px sans-serif}.bcapc-popup{position:relative;width:342px}.bs-modal{padding:16px;width:342px;box-sizing:border-box}.bs-main-image{position:relative;width:310px;height:192px;overflow:hidden;background-position:-60px 0;background-size:370px 192px}.bs-slide-image{position:absolute;left:0;top:0;width:60px;height:192px;background-position:0 0;background-size:370px 192px}.bs-slide-container{position:relative;margin-top:16px;width:310px;height:44px;border:1px solid #ddd;box-sizing:border-box}.bs-slide-thumb{position:absolute;left:0;top:-1px;margin-left:-1px;width:44px;height:44px;background:#fcd535}.bs-tipmessage-container{display:none}.bs-validate-success{background:#02c076}.bs-validate-fail{background:#d9304e}.bs-checkbox-box{width:40px;height:40px;border:2px solid #ddd}.bs-checkbox-success{background:#fcd535}.bs-checkbox-modal{padding:20px;width:300px}.scaled{transform:scale(.5);transform-origin:top left}
.intro .bs-slide-image{animation:SlideShowAnimation .8s ease-out both}@keyframes SlideShowAnimation{from{transform:translate(-60px,0);opacity:0}to{transform:translate(0,0);opacity:1}}
.bcap-modal{width:370px;padding:16px}.bcap-text-message-title2{font-size:24px;height:30px}.bcap-image-area-container,.bcap-image-table-container{position:relative;width:338px;height:338px;overflow:hidden}.bcap-image-table{position:absolute;top:0;width:338px;height:338px;display:grid;grid-template-columns:repeat(3,110px);grid-template-rows:repeat(3,110px);gap:4px}.page1{left:0}.page2{left:100%}.page1.rotated{left:-100%}.page2.rotated{left:0}.bcap-image-cell-container{width:110px;height:110px;position:relative}.bcap-image-cell-image{width:100%;height:100%;background-size:330px 330px}.bcap-image-cell-container.selected .bcap-image-cell-image{transform:scale(.9)}.bcap-image-cell-selected-icon{position:absolute;inset:40px;background:#fcd535}.bcap-verify-button{width:120px;height:40px;background:#fcd535;margin-top:16px}.bcap-success-message,.bcap-error-message{position:absolute;bottom:-48px;height:48px;width:100%;box-sizing:border-box;background:#cfc}.bcap-tipmessage-container{display:none}
</style>
<form><div class="bcapc-popup"><div class="bs-modal"><div class="bs-title">Security Verification</div><div class="bs-main-image" _id="im"><div class="bs-slide-image" _id="shim"></div></div><div class="bs-tipmessage-container"><div class="bs-tipmessage-text">Loading</div></div><div class="bs-slide-container" _id="sl"><div class="bs-slide-thumb" _id="slth"><span>→</span></div></div></div></div><button>Submit application</button></form>
<script type="module">
import * as adapter from '/binance-adapter.js';window.adapter=adapter;
const mode=new URL(location.href).searchParams.get('mode')||'slide';window.counts={moves:0,releases:0,submits:0,checks:0,selections:0,verifies:0};window.fixtureAccepted=false;
document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();counts.submits++;});
if(mode.includes('scaled'))document.querySelector('.bcapc-popup').classList.add('scaled');
const modal=document.querySelector('.bs-modal');
if(mode==='intro')document.querySelector('.bcapc-popup').classList.add('intro');
if(mode.startsWith('grid')){
 const pages=mode.includes('two')?2:1;modal.className='bcap-modal';modal.innerHTML='<div class="bcap-text-message-title">Select all matching images</div><div class="bcap-text-message-title2" id="tagLabel">Vehicles</div><div class="bcap-image-area-container"><div class="bcap-image-table-container"></div><div class="bcap-tipmessage-container">Loading</div><div class="bcap-success-message" style="bottom:-48px">Verification successful</div><div class="bcap-error-message" style="bottom:-48px">Please try again</div></div><div class="bcap-verify-button" _id="vb" _action="verify">'+(pages===2?'Next':'Verify')+'</div>';
 const container=modal.querySelector('.bcap-image-table-container');
 for(let page=1;page<=pages;page++){const table=document.createElement('div');table.className=`bcap-image-table page${page}`;const sprite=document.createElement('canvas');sprite.width=sprite.height=330;const ctx=sprite.getContext('2d');for(let i=0;i<9;i++){ctx.fillStyle=`rgb(${20+i*20},${30+page*60},${220-i*17})`;ctx.fillRect(i%3*110,Math.floor(i/3)*110,110,110);}const url=sprite.toDataURL();for(let i=0;i<9;i++){const tile=document.createElement('div');tile.className='bcap-image-cell-container';tile.setAttribute('_action','imageSelect');tile.setAttribute('_id',`${page}${i}`);tile.innerHTML=`<div class="bcap-image-cell-image" style="background-image:url(${url});background-position:${-i%3*110}px ${-Math.floor(i/3)*110}px"></div>`;table.append(tile);}container.append(table);}
 window.refresh=()=>{for(const image of modal.querySelectorAll('.bcap-image-cell-image'))image.style.backgroundPosition='-220px -220px';};
 modal.addEventListener('click',event=>{const tile=event.target.closest('[_action="imageSelect"]');if(tile){counts.selections++;tile.toggleAttribute('selected');tile.classList.toggle('selected');if(!tile.querySelector('.bcap-image-cell-selected-icon'))tile.innerHTML+='<div class="bcap-image-cell-selected-icon"></div>';if(mode==='grid-refresh'&&counts.selections===1)refresh();}if(event.target.closest('[_action="verify"]')){counts.verifies++;if(pages===2&&!container.firstElementChild.classList.contains('rotated')){for(const table of container.children)table.classList.add('rotated');event.target.textContent='Verify';}else if(mode.includes('accept')||mode.includes('two'))modal.querySelector('.bcap-success-message').style.bottom='0px';else if(mode==='grid-reject')modal.querySelector('.bcap-error-message').style.bottom='0px';}});
 if(mode==='grid-loading'){modal.querySelector('.bcap-tipmessage-container').style.display='block';container.style.display='none';}
}else if(mode==='checkbox'){
 modal.className='bs-checkbox-modal';modal.innerHTML='<div class="bs-checkbox-row"><div class="bs-checkbox-box" _action="check" role="checkbox" aria-checked="false">□</div><span>I am not a robot</span></div>';
 modal.querySelector('.bs-checkbox-box').addEventListener('click',event=>{counts.checks++;event.currentTarget.classList.add('bs-checkbox-success');event.currentTarget.setAttribute('aria-checked','true');});
}else{
 const sprite=document.createElement('canvas');sprite.width=370;sprite.height=192;const ctx=sprite.getContext('2d'),bg=document.createElement('canvas');bg.width=310;bg.height=192;const bc=bg.getContext('2d'),pixels=bc.createImageData(310,192);
 for(let y=0;y<192;y++)for(let x=0;x<310;x++){const i=(y*310+x)*4;pixels.data[i]=110+65*Math.sin(x*.12+y*.08);pixels.data[i+1]=125+80*Math.cos(x*.065-y*.11);pixels.data[i+2]=135+70*Math.sin(x*.09-y*.035);pixels.data[i+3]=255;}bc.putImageData(pixels,0,0);bc.fillStyle='#fbec8d';bc.fillRect(135,77,27,43);bc.strokeStyle='#715bcb';bc.lineWidth=7;bc.beginPath();bc.moveTo(10,180);bc.lineTo(300,20);bc.stroke();
 ctx.drawImage(bg,60,0);ctx.save();ctx.beginPath();ctx.roundRect(4,65,49,51,8);ctx.arc(28,64,10,0,Math.PI*2);ctx.clip();ctx.drawImage(bg,142,0,60,192,0,0,60,192);ctx.restore();
 const image=modal.querySelector('.bs-main-image'),piece=modal.querySelector('.bs-slide-image'),handle=modal.querySelector('.bs-slide-thumb');window.refresh=()=>{ctx.fillStyle='#e6316e';ctx.fillRect(60,0,310,192);const url=sprite.toDataURL();image.style.backgroundImage=piece.style.backgroundImage=`url(${url})`;};const url=sprite.toDataURL();image.style.backgroundImage=piece.style.backgroundImage=`url(${url})`;
 let active=false,start=0,distance=0;
 handle.addEventListener('mousedown',event=>{active=true;start=event.clientX;});
 document.addEventListener('mousemove',event=>{if(!active)return;counts.moves++;distance=Math.min(250,Math.max(0,event.clientX-start));handle.style.left=piece.style.left=`${distance}px`;if(mode==='refresh'&&counts.moves===3)refresh();});
 document.addEventListener('mouseup',()=>{if(!active)return;active=false;counts.releases++;window.fixtureAccepted=Math.abs(distance-142)<2;if(mode==='accept'&&fixtureAccepted)handle.classList.add('bs-validate-success');if(mode==='reject')handle.classList.add('bs-validate-fail');});
}
window.ready=true;
</script>
