<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal OCR</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header class="popup-header"><span class="wordmark">Universal <b>OCR</b></span><span class="local-tag"><i></i> Local</span></header>
  <main>
    <h1>Make any text<br>yours to use.</h1>
    <p class="muted">Read text from an image or anything you can see on a webpage.</p>
    <div class="popup-actions">
      <button id="region" class="primary">Select a region <span aria-hidden="true">↗</span></button>
      <button id="viewport" class="secondary">Read the visible page</button>
      <button id="workspace" class="text-button">Upload or paste an image <span aria-hidden="true">→</span></button>
    </div>
    <label class="verify-option">Challenge type <select id="assist-provider"><option value="auto">Detect automatically</option><option value="grids">reCAPTCHA / hCaptcha</option><option value="recaptcha-v3">reCAPTCHA v3 native action</option><option value="aws-waf">AWS WAF grid / split-image (experimental)</option><option value="binance">Binance slider / grids / checkbox (experimental)</option><option value="mtcaptcha">MTCaptcha text</option><option value="text-captcha">Text image</option><option value="geetest-v3">Geetest v3 puzzle</option><option value="geetest-v4">Geetest v4 slider / icons / grid</option><option value="tencent">Tencent puzzle (experimental)</option><option value="tiktok">TikTok slide / circle / shape pair (experimental)</option><option value="prosopo">Procaptcha native verification</option><option value="captchafox">CaptchaFox slider (experimental)</option></select></label>
    <button id="assist" class="secondary">Assist visible challenge</button>
    <label class="verify-option"><input id="auto-verify" type="checkbox">Allow CAPTCHA completion. Typing, dragging, or Verify may continue a pending form.</label>
    <label id="browser-input-option" class="verify-option" hidden><input id="browser-input" type="checkbox">Use browser input for sliders and checkboxes. Attaches Chrome’s debugger to this tab only.</label>
    <button id="stop-assist" class="secondary" hidden>Stop challenge assistance</button>
    <button id="scan" class="text-button">Detect challenges on this page</button><button id="control" class="secondary">Visual tools &amp; site rules</button>
    <p id="popup-status" role="status" aria-live="polite"></p>
    <footer>Runs on your device. No account needed.<br><span class="shortcut">Shortcut: Alt / Option + Shift + O</span></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
