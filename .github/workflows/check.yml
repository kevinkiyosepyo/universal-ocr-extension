name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:browser
      - run: npm run test:automation
      - run: npm run test:challenges
      - run: npm run test:challenge-stop
      - run: npm run test:points
      - run: npm run test:tiktok
      - run: npm run test:aws-waf-slide
      - run: npm run test:geetest-images
      - run: npm run test:aws-waf
      - run: npm run test:binance
      - run: npm run test:recaptcha-v3
      - run: npm run test:provider-routes
      - run: npm run test:widgets
      - run: npm run test:browser-input
      - run: npm run build:firefox
      - run: npm run lint:firefox
      - run: npm run test:firefox
